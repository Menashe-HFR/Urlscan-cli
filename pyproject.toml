[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "urlscan-studio"
version = "2.0.0"
description = "An asynchronous URL investigation workbench with a durable job queue, API, CLI, and interactive demo."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "httpcore>=1.0.9,<1.1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
urlscan-studio = "urlscan_studio.cli:main"

[tool.setuptools.packages.find]
include = ["urlscan_studio*"]

[tool.setuptools.package-data]
urlscan_studio = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
